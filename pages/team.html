<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lomdei - MasterEd</title>
  <link rel="icon" type="image/svg+xml" href="../public/images/New Lomdei Logo.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous">
  <link rel="stylesheet" href="../App.css">
  <link rel="stylesheet" href="./contact.css">
  <link rel="stylesheet" href="./team.css">
  <link rel="stylesheet" href="../Header.css">
  <link rel="stylesheet" href="../Footer.css">
</head>
<body>
  <div id="header"></div>

  <section class="header">
    <main class="contact-main" id="contact-intro">
      <h1 class="contact-title">Our Team</h1>
    </main>
  </section>

  <section id="team">
    <div class="teamContainer" id="team-root-head"><!-- rendered via JS --></div>
    <div class="teamContainer" id="team-root-admin"><!-- rendered via JS --></div>
    <div class="teamContainer" id="team-root-member"><!-- rendered via JS --></div>

  </section>

  <div id="footer"></div>

  <script>
    // Dynamically load header and footer HTML
    function importSection(id, url, selector) {
      fetch(url)
        .then(res => res.text())
        .then(html => {
          const temp = document.createElement('div');
          temp.innerHTML = html;
          const el = temp.querySelector(selector);
          if (el) document.getElementById(id).appendChild(el);
        });
    }
    importSection('header', '../header.html', 'header');
    importSection('footer', '../footer.html', 'footer');

    // Hamburger menu logic for dynamically loaded header
    function setupHamburgerMenu() {
      const hamburgerBtn = document.getElementById('hamburgerBtn');
      const mobileMenu = document.getElementById('mobileMenu');
      if (hamburgerBtn && mobileMenu) {
        hamburgerBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          mobileMenu.classList.toggle('open');
          hamburgerBtn.setAttribute('aria-expanded', mobileMenu.classList.contains('open'));
        });
        mobileMenu.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', () => {
            mobileMenu.classList.remove('open');
          });
        });
        document.addEventListener('click', function(e) {
          if (mobileMenu.classList.contains('open') && !mobileMenu.contains(e.target) && !hamburgerBtn.contains(e.target)) {
            mobileMenu.classList.remove('open');
          }
        });
      }
    }
    function waitForHeaderAndSetup() {
      const hamburgerBtn = document.getElementById('hamburgerBtn');
      if (hamburgerBtn) {
        setupHamburgerMenu();
      } else {
        setTimeout(waitForHeaderAndSetup, 50);
      }
    }
    waitForHeaderAndSetup();

    // Render team from JSON
    async function renderTeam() {
      try {
        const res = await fetch('../src/data/team.json');
        if (!res.ok) throw new Error('Failed to load team.json');
        const members = await res.json();
        function getContainerForCategory(cat) {
          if (cat === 'head') return document.getElementById('team-root-head');
          if (cat === 'admin') return document.getElementById('team-root-admin');
          return document.getElementById('team-root-member');
        }
        members.forEach((m, i) => {
          // Card
          const card = document.createElement('div');
          card.className = 'teamCard';
          const link = document.createElement('a');
          link.setAttribute('data-bs-toggle', 'modal');
          link.setAttribute('data-bs-target', `#bio${i}`);
          const img = document.createElement('img');
          img.src = m.image;
          img.alt = m.name;
          const h4 = document.createElement('h4');
          h4.textContent = m.name;
          const p = document.createElement('p');
          p.innerHTML = m.title;
          const h5 = document.createElement('h5');
          h5.className = 'fullBio';
          h5.textContent = 'Full Bio';
          link.append(img, h4, p, h5);
          card.appendChild(link);
          const container = getContainerForCategory(m.category) || document.getElementById('team-root-member');
          container.appendChild(card);

          // Modal
          const modal = document.createElement('div');
          modal.className = 'modal fade';
          modal.id = `bio${i}`;
          modal.tabIndex = -1;
          modal.setAttribute('aria-labelledby', `bio${i}Label`);
          modal.setAttribute('aria-hidden', 'true');
          modal.innerHTML = `
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title" id="bio${i}Label">${m.name}</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">${m.bio}</div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
              </div>
            </div>`;
          document.body.appendChild(modal);
        });
      } catch (err) {
        console.error(err);
      }
    }
    document.addEventListener('DOMContentLoaded', renderTeam);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
</body>
</html>
